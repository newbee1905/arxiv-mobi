# Publishes the site to GitHub Pages on every push to the default branch.
#
# The repository is already a plain static site, so you can equally serve it
# straight from a branch (Settings → Pages → Deploy from a branch). This
# workflow exists so that Pages does not run Jekyll over the files and so
# deploys are visible in the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
